<head>

<style>
/* Layout: one narrow column, a diary page per calendar day. Each year of that day is a row, newest first. Bottom tab bar switches Day / Calendar / Search. */
:root {
  --bg: #F6EEE6;
  --paper: #FFFCF8;
  --ink: #3A322D;
  --mute: #7A6E65;
  --line: #E7DDD1;
  --accent: #7A7352;
  --accent-ink: #FFFFFF;
  --violet: color-mix(in srgb, var(--accent) 26%, #fff);
  --violet-ink: #3A322D;
  --orchid: color-mix(in srgb, var(--accent) 26%, #fff);
  --mark: color-mix(in srgb, var(--accent) 26%, #fff);
  --shadow: rgba(90, 70, 50, .14);
  --glow1: rgba(255, 255, 255, .55);
  --glow2: color-mix(in srgb, var(--accent) 14%, transparent);
  --font-display: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --font-text: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Outfit", "Helvetica Neue", Arial, sans-serif;
}
/* one light look on purpose: no dark theme */
* { box-sizing: border-box; }
html, body { min-height: 100%; overscroll-behavior-y: none; }   /* no pull-down refresh or bounce at the top */
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; }

/* app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.status { font: 400 12px var(--font-data); color: var(--mute); }
.status.err { color: #C0392B; }
.note { font-size: 13px; color: var(--mute); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }

/* day navigator */
/* the day (with the arrows) stays under the title bar while you scroll the Journal or the Check-in */
.nav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 4px; margin-block: 0 14px; padding-block: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 72px)); z-index: 4; background: var(--bg); }
.nav .step { height: 48px; border-radius: 12px; font-size: 22px; color: var(--mute); }
.nav .center { text-align: center; padding: 4px 8px; border-radius: 12px; }
.dayname { display: block; font-weight: 700; font-size: clamp(30px, 9vw, 42px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.daysub { display: block; margin-top: 6px; font: 400 12px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.today-pill { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--mark); color: #1B1405; font-weight: 500; letter-spacing: .06em; }
.jump { display: block; margin: -8px auto 16px; font: 500 13px var(--font-data); color: var(--accent); padding: 8px 12px; }

/* year rows */
.rows { display: flex; flex-direction: column; gap: 4px; }
.row { padding: 16px 0 18px; border-top: 1px solid var(--line); }
.row.now { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 20px; margin-bottom: 14px; }
.yr { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.yr .y { font-weight: 700; font-size: 26px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--accent); }
.yr .ago, .yr .wk { font: 400 12px var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.yr .wk { margin-left: auto; }
textarea { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); resize: none; overflow: hidden; padding: 2px 0; border-radius: 6px; font: 400 17px/1.65 var(--font-text); min-height: 2.6em; }
.now textarea { min-height: 8.5em; }
textarea::placeholder { color: var(--mute); opacity: .85; font-style: italic; }
textarea:disabled { opacity: .6; }
.lone { display: block; font: 500 11px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-bottom: 2px; }
.learn { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.lone, .learn .ll { display: flex !important; align-items: center; justify-content: space-between; }
.bul { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--accent); font-size: 18px; line-height: 1; text-transform: none; }
.learn .ll { display: block; font: 500 11px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-bottom: 2px; }
.learn textarea, .now .learn textarea { min-height: 2.6em; font-size: 16px; }
.hint { color: var(--mute); font-size: 14px; max-width: 46ch; margin: 10px 4px 0; }
.future { padding: 14px 4px; color: var(--mute); font-size: 14px; }

/* calendar */
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 6px 0 20px; }
.stat b { display: block; font-weight: 700; font-size: 28px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font: 400 11px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.mnav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; margin-bottom: 8px; }
.mnav h2 { margin: 0; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.mnav .step { height: 44px; font-size: 22px; color: var(--mute); border-radius: 12px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font: 400 11px var(--font-data); letter-spacing: .06em; color: var(--mute); padding: 6px 0; }
.cell { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-variant-numeric: tabular-nums; }
.cell span { font-weight: 500; font-size: 15px; }
.cell .mj { position: absolute; top: 3px; right: 4px; font-size: 13px; line-height: 1; font-weight: 400; }
.cell i { position: absolute; bottom: 3px; right: 6px; font: normal 400 10px var(--font-data); color: var(--mute); }
.cell.c1 { background: color-mix(in srgb, var(--accent) 14%, var(--paper)); }
.cell.c2 { background: color-mix(in srgb, var(--accent) 28%, var(--paper)); }
.cell.c3 { background: color-mix(in srgb, var(--accent) 44%, var(--paper)); }
.cell.c4 { background: color-mix(in srgb, var(--accent) 62%, var(--paper)); }
.cell.c4 span, .cell.c4 i { color: var(--accent-ink); }
.cell.today { box-shadow: 0 0 0 2px var(--mark); }
.cell.pad { visibility: hidden; }
.legend { margin-top: 12px; font-size: 13px; color: var(--mute); }
.btn { margin-top: 28px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-weight: 500; font-size: 14px; }

/* search */
.search { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 400 16px var(--font-display); }
.results { margin-top: 16px; display: flex; flex-direction: column; }
.hit { text-align: left; padding: 14px 4px; border-top: 1px solid var(--line); display: block; width: 100%; }
.hit .when { font: 400 12px var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.hit .snip { display: block; margin-top: 4px; font: 400 15px/1.55 var(--font-text); overflow-wrap: anywhere; }
mark { background: color-mix(in srgb, var(--mark) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { color: var(--mute); margin-top: 20px; font-size: 14px; }

/* mood + activity chips */
.mood { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 10px; }
.mood button { width: 44px; height: 44px; border-radius: 12px; font-size: 24px; line-height: 1; border: 1px solid transparent; filter: grayscale(1); opacity: .55; }
.mood button[aria-pressed="true"] { filter: none; opacity: 1; background: var(--paper); border-color: var(--accent); }
.mood .lbl { margin-left: 6px; font: 400 12px var(--font-data); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--mute); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.ghost { border-style: dashed; color: var(--accent); }
button:disabled { cursor: default; }

/* activities tab */
.ptitle { margin: 6px 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.addform { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; margin-bottom: 12px; }
.addform input { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 400 16px var(--font-display); min-width: 0; }
.addform .emo { text-align: center; font-size: 20px; }
.addform .add { padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.alist { display: flex; flex-direction: column; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.arow .nm { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.arow .meta { font: 400 12px var(--font-data); letter-spacing: .04em; color: var(--mute); }
.arow .rm { grid-row: 1 / span 2; grid-column: 2; padding: 10px 12px; font-size: 13px; color: var(--mute); border-radius: 8px; }
.arow .rm.yes { color: #C0392B; font-weight: 600; }

/* overview */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; margin: 6px 0 12px; }
.seg button { padding: 10px; border-radius: 9px; font-weight: 500; font-size: 14px; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ahead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.ahead .ptitle { margin: 0; font-size: 22px; }
.pfilters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.pf { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--mute); }
.pf[aria-pressed="true"] { color: var(--ink); border-color: var(--mute); background: var(--paper); }
.pf .n { font: 400 11px var(--font-data); color: var(--mute); }
.pcal { --off: color-mix(in srgb, var(--mute) 16%, var(--paper)); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.sq { display: block; position: relative; aspect-ratio: 1 / 1; border-radius: 4px; background: var(--off); font-style: normal; cursor: pointer; }
.sq.fut { background: transparent; border: 1px dashed var(--line); }
.sq.td { box-shadow: 0 0 0 2px var(--mark); }
.sq.x { visibility: hidden; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mgrid .dw { text-align: center; font: 400 11px var(--font-data); color: var(--mute); padding: 2px 0 4px; }
.mgrid .sq { border-radius: 8px; }
.mgrid .sq b { position: absolute; left: 3px; bottom: 3px; padding: 2px 4px; border-radius: 4px; font: 500 10px/1 var(--font-data); color: var(--ink); background: color-mix(in srgb, var(--paper) 88%, transparent); }
.ygrid { display: grid; grid-template-columns: 28px repeat(31, minmax(0, 1fr)); gap: 2px; align-items: center; }
.ygrid .sq { border-radius: 2px; }
.ml { font: 400 10px var(--font-data); color: var(--mute); }

/* search window + calendar magnifier */
.ctop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lupa { flex: none; width: 44px; height: 44px; display: grid; place-items: center; margin-top: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-start; justify-content: center; background: color-mix(in srgb, var(--ink) 45%, transparent); padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.shead { display: flex; gap: 8px; align-items: center; }
.shead .search { flex: 1; min-width: 0; }
.close { padding: 12px 10px; border-radius: 12px; font-weight: 500; color: var(--accent); }

/* home */
.back { font: 500 14px var(--font-data); color: var(--accent); padding: 8px 12px 8px 0; margin-left: -2px; }
.hello { padding-block: max(36px, 9vh) 28px; }
.hdate { margin: 0 0 10px; font: 400 12px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.hello h1 { margin: 0; font-weight: 700; font-size: clamp(40px, 13vw, 60px); line-height: 1.02; letter-spacing: -.03em; text-wrap: balance; }
.hsub { margin: 12px 0 0; font: 400 17px/1.55 var(--font-text); color: var(--mute); max-width: 34ch; }
.apps { display: flex; flex-direction: column; gap: 10px; }
.app { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
.app .ico { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: 500 15px var(--font-data); letter-spacing: -.02em; }
.app .atxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.app .aname { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.app .adesc { font-size: 14px; line-height: 1.4; color: var(--mute); }
.app .ameta { margin-top: 4px; font: 400 12px var(--font-data); color: var(--accent); }
.app .go { flex: none; font-size: 26px; color: var(--mute); }
.more { margin: 18px 4px 0; font-size: 13px; color: var(--mute); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab { padding: 12px 4px; border-radius: 12px; font-weight: 500; font-size: 13px; color: var(--mute); }
.tab[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
@media (prefers-reduced-motion: no-preference) { .row, .cell { transition: background-color .15s; } }

/* soft, rounded look: pale lilac ground, white cards, aubergine pills, orchid highlights */
.hello { position: relative; }
.hello::before { content: ""; position: fixed; z-index: -1; left: 0; right: 0; top: 0; height: 380px; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); background: radial-gradient(60% 70% at 12% 15%, var(--glow1), transparent 70%), radial-gradient(50% 60% at 95% 0%, var(--glow2), transparent 70%); pointer-events: none; }
.hello h1 .nm2 { color: var(--orchid); }
.hdate { font-weight: 500; }
.hsub { font-weight: 300; font-size: 18px; }
.app { border: 0; border-radius: 26px; padding: 20px; box-shadow: 0 14px 34px -16px var(--shadow); }
.app .ico { border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--orchid); font-weight: 600; }
.app .aname { font-weight: 600; }
.back { padding: 8px 14px; margin-left: 0; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.status { font-weight: 400; }
.nav .step, .mnav .step { border-radius: 50%; width: 44px; height: 44px; background: var(--paper); border: 1px solid var(--line); margin: 0 auto; }
.dayname { font-weight: 600; }
.jump { border-radius: 999px; background: var(--paper); border: 1px solid var(--line); width: max-content; }
.row.now { border: 0; border-radius: 28px; padding: 22px 22px 24px; box-shadow: 0 16px 36px -18px var(--shadow); }
.yr .y { font-weight: 600; }
.mood button { border-radius: 50%; }
.mood button[aria-pressed="true"] { border: 2px solid var(--orchid); box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--line); }
.chip { background: var(--paper); }
.chip[aria-pressed="true"] { background: var(--accent); }
.chip.ghost { background: transparent; border-color: var(--orchid); color: var(--accent); }
.learn { border-top-style: solid; }
.row.check .learn textarea, .row.now.check .learn textarea { min-height: 5.5em; }
.bar .brand { margin-right: auto; margin-left: 4px; color: var(--ink); }
.cell { border-radius: 16px; border: 0; box-shadow: 0 4px 10px -8px var(--shadow); }
.lupa { border-radius: 50%; }
.cell.on { background: var(--violet); box-shadow: none; }
.cell.on span { color: var(--violet-ink); }
.btn { border-radius: 999px; background: var(--accent); color: var(--accent-ink); border: 0; padding: 14px 22px; font-weight: 500; }
.seg { border-radius: 999px; }
.seg button { border-radius: 999px; }
.pf { background: var(--paper); }
.pf[aria-pressed="true"] { border-color: var(--orchid); box-shadow: inset 0 0 0 1px var(--orchid); }
.pcal { border: 0; border-radius: 26px; padding: 14px; box-shadow: 0 14px 34px -18px var(--shadow); }
.search, .addform input { border-radius: 999px; padding-inline: 18px; }
.addform .add { border-radius: 999px; }
.sheet { border-radius: 30px; padding: 18px; }
.close { color: var(--accent); }
/* same look as Movies & Series: round back button and big title on top, continuous bottom bar with icons */
.tabs { background: var(--paper); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabs .in { max-width: 640px; gap: 0; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 9px; border-radius: 0; font-size: 12px; }
.tab svg { display: block; }
.tab[aria-current="page"] { background: none; color: var(--accent); box-shadow: none; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 50%; width: 36px; height: 3px; margin-left: -18px; border-radius: 0 0 3px 3px; background: var(--accent); }
.bar { align-items: center; padding-block: 18px 10px; }
.back { flex: none; width: 44px; height: 44px; padding: 0; margin: 0; display: grid; place-items: center; border-radius: 50%; background: var(--paper); border: 0; box-shadow: 0 8px 20px -12px var(--shadow); color: var(--ink); font-size: 24px; line-height: 1; padding-bottom: 3px; }
.bar .brand { flex: 1; margin: 0 0 0 6px; font-weight: 600; font-size: 26px; letter-spacing: -.02em; color: var(--ink); }

/* notes */
.nhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.nhead .ptitle { margin: 6px 0; }
.nnew { padding: 10px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 14px; }
.nnew:disabled { opacity: .5; }
.nnew.nadd { display: block; width: 100%; padding: 13px 18px; margin: 4px 0 12px; font-size: 15px; }
.nlist { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.ncard { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; padding: 16px 18px; background: var(--paper); border-radius: 22px; box-shadow: 0 10px 26px -16px var(--shadow); }
.ncard b { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.ncard span { font-size: 14px; line-height: 1.45; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ncard i { font: normal 400 12px var(--font-data); color: var(--mute); }
.ned { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

/* text boxes grow with what is typed. The page position is kept while the box is measured, so nothing jumps up and down. */
function fitBox(t) {
  if (!t || t.tagName !== 'TEXTAREA' || !t.getClientRects().length) return;
  var keep = [], n = t.parentNode, se = document.scrollingElement || document.documentElement;
  for (; n && n.nodeType === 1; n = n.parentNode) if (n.scrollTop) keep.push([n, n.scrollTop]);

  t.style.height = 'auto';
  var h = t.scrollHeight + (cs.boxSizing === 'border-box' ? bd : -pd);
  t.style.height = h + 'px';
  keep.forEach(function (k) { if (k[0].scrollTop !== k[1]) k[0].scrollTop = k[1]; });

(function () {

    var r = from.getBoundingClientRect();
    iwin.style.transformOrigin = (r.left + r.width / 2) + 'px ' + (r.top + r.height / 2) + 'px';
    iwin.classList.remove('off');
    var a = iwin.animate([{ transform: 'scale(.16)', opacity: 0, borderRadius: '90px' }, { opacity: 1, offset: .3 }, { transform: 'scale(1)', opacity: 1, borderRadius: '0px' }], { duration: 380, easing: IEASE, fill: 'forwards' });
    homeEl.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.9)', opacity: .35 }], { duration: 380, easing: IEASE, fill: 'forwards' });
    a.onfinish = function () { ibusy = false; };
  }
  function closeIApp() {
    if (!icur || ibusy) return; ibusy = true;
    var a = iwin.animate([{ transform: 'scale(1)', opacity: 1, borderRadius: '0px' }, { opacity: 1, offset: .7 }, { transform: 'scale(.16)', opacity: 0, borderRadius: '90px' }], { duration: 300, easing: IEASE, fill: 'forwards' });
    homeEl.animate([{ transform: 'scale(.9)', opacity: .35 }, { transform: 'scale(1)', opacity: 1 }], { duration: 300, easing: IEASE, fill: 'forwards' });
    a.onfinish = function () {
      iwin.classList.add('off'); Object.keys(frames).forEach(function (k) { frames[k].style.visibility = 'hidden'; }); icur = null; ibusy = false;
      iwin.getAnimations().concat(homeEl.getAnimations()).forEach(function (x) { x.cancel(); });
      homeInfo(); refreshFrames(500);
    };
  }
  /* the apps that live in this page (Check-in, Journal, Notes) fade and zoom in and out too, instead of cutting */
  var _show = show, tbusy = false;
  show = function (s) {
    var cur = !homeEl.hidden ? 'home' : !jEl.hidden ? 'jr' : !NE.hidden ? 'notes' : 'home', target = (s === 'diary' || s === 'check') ? 'jr' : s;
    var box = function (x) { return x === 'home' ? homeEl : x === 'notes' ? NE : jEl; };
    if (tbusy || cur === target || !box(cur).animate || icur) { _show(s); return; }
    tbusy = true; setTimeout(function () { tbusy = false; }, 900);
    var out = box(cur), a = out.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: target === 'home' ? 'scale(1.04)' : 'scale(.94)' }], { duration: 130, easing: 'ease-out', fill: 'forwards' });
    a.onfinish = function () {
      _show(s); out.getAnimations().forEach(function (x) { x.cancel(); });
      var b = box(target).animate([{ opacity: 0, transform: target === 'home' ? 'scale(.96)' : 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 260, easing: IEASE });
      b.onfinish = function () { tbusy = false; };
    };
  };
  homeEl.addEventListener('click', function (e) { var b = e.target.closest('[data-open]'); if (b) openIApp(b.dataset.open, b.querySelector('.sq') || b); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeIApp(); });

  /* swipe left or right on the Day tab to change the day (left = next day, right = previous day) */
  (function () {
    var sx = 0, sy = 0, st = 0, ok = false;
    document.addEventListener('touchstart', function (e) {
      var t = e.target;
      ok = !jEl.hidden && e.touches[0].clientX > EDGE && view === 'day' && am.hidden && sm.hidden && e.touches.length === 1 && !(t.closest && t.closest('input, select')) && !(document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName));   // swiping over the text works, unless you are editing it
      if (ok) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }
    }, { passive: true });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) ok = false; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (!ok) return;
      ok = false;
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 700) shift(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  /* boot */
  render();
  (async function () {
    var db = null, uid = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use('db');
        var u = await window.claude.use('user');
        uid = u ? await u.id() : null;
      }
    } catch (e) { db = null; }
    if (db && uid) {
      mode = 'cloud';
      col = db.collection('data/users/' + uid);
      var fallback = setTimeout(function () { if (!loaded) { loaded = true; setStatus('Offline, showing what is on this device', true); render(); } }, 8000);
      col.onSnapshot(function (snap) {
        snap.docChanges().forEach(function (c) {
          var id = c.doc.id;
          if (c.doc.metadata.hasPendingWrites) return;
          if (id === 'notes') {
            if (nview !== 'edit') { if (c.type === 'removed') notes = []; else { var ns = thaw(c.doc.data()); notes = (ns && ns.items) || []; } }
            return;
          }
          if (id === 'settings') { if (c.type === 'removed') acts = []; else { var s = thaw(c.doc.data()); acts = (s && s.acts) || []; ensureColors(); } return; }
          if (!/^\d{4}-\d{2}$/.test(id) || dirty.has(id)) return;
          if (c.type === 'removed') delete store[id];
          else { var dd = thaw(c.doc.data()) || {}; store[id] = { t: dd.days || {}, m: dd.moods || {}, a: dd.acts || {}, l: dd.learned || {} }; }
        });
        if (!snap.metadata.fromCache && !loaded) { loaded = true; clearTimeout(fallback); setStatus('Saved'); render(); }
        else if (loaded) refreshAfterData();
      }, function () { setStatus('Connection lost. Reopen the page.', true); });
    } else {
      mode = 'local';
      try {
        var raw = JSON.parse(localStorage.getItem(LS) || '{}') || {};
        Object.keys(raw).forEach(function (k) { if (/^\d{4}-\d{2}$/.test(k)) store[k] = norm(raw[k]); });   // only real months
        acts = JSON.parse(localStorage.getItem(LSA) || '[]') || []; ensureColors();
        notes = JSON.parse(localStorage.getItem(LSN) || '[]') || [];
      } catch (e) { store = {}; acts = []; }
      loaded = true; render();
    }
  })();
})();
</script>
<script>
(function () {
  var pairs = [[document.getElementById('acct'), document.getElementById('syncbox')], [document.getElementById('setb'), document.getElementById('setbox')]];
  function closeAll(except) { pairs.forEach(function (x) { if (x[1] !== except) { x[1].hidden = true; x[0].setAttribute('aria-expanded', 'false'); } }); }
  pairs.forEach(function (x) {
    x[0].addEventListener('click', function (e) { e.stopPropagation(); closeAll(x[1]); x[1].hidden = !x[1].hidden; x[0].setAttribute('aria-expanded', String(!x[1].hidden)); });
  });

<script>
/* automatic copies: what is kept, and putting one back */
(function () {
  var bkm = document.getElementById('bkm'), bksh = document.getElementById('bksh'), ask = '', busy = false;
  var MON3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'], KIND = { d: 'Diária', p: 'Antes de sincronizar', r: 'Antes de restaurar' };
  function p2(n) { return String(n).padStart(2, '0'); }
  function fmt(at) {
    var d = new Date(at), t = new Date(), y = new Date(t); y.setDate(t.getDate() - 1);
    var day = d.toDateString() === t.toDateString() ? 'Hoje' : d.toDateString() === y.toDateString() ? 'Ontem' : d.getDate() + ' ' + MON3[d.getMonth()];
    return day + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function sumTxt(s) {
    s = s || {}; var a = [];
    if (s.j != null) a.push(s.j + ' dias no Journal'); if (s.n) a.push(s.n + ' notas'); if (s.e) a.push(s.e + ' eventos'); if (s.f) a.push(s.f + ' filmes/livros'); if (s.p) a.push(s.p + ' produtos'); if (s.r) a.push(s.r + ' receitas');
    return a.join(' · ');
  }
  function info() {
    if (!window.DLBackup) return;
    window.DLBackup.list(function (l) { var el = document.getElementById('bkautoinfo'); if (el) el.textContent = l.length ? 'Última cópia: ' + fmt(l[0].at) + ' · ' + l.length + ' guardadas' : 'Ainda sem cópias.'; });
  }
  function paint() {
    window.DLBackup.list(function (l) {
      bksh.innerHTML = '<h2>Cópias automáticas</h2><p class="bkinfo" style="margin:0">Guardadas neste telemóvel: uma por dia (as últimas 14) e uma antes de cada sincronização que muda dados. Restaurar põe os dados desta cópia em todos os teus dispositivos.</p>' +
        (l.length ? l.map(function (x) { return '<div class="bke"><div class="bkt"><b>' + fmt(x.at) + '</b><small>' + KIND[x.k] + ' · ' + sumTxt(x.sum) + '</small></div><button data-bkr="' + x.id + '"' + (ask === x.id ? ' class="sure"' : '') + '>' + (ask === x.id ? 'Toca de novo' : 'Restaurar') + '</button></div>'; }).join('') : '<p class="bkinfo">Ainda sem cópias.</p>') +
        '<button class="bkc" id="bkclose">Fechar</button>';
    });
  }
  function close() { bkm.hidden = true; ask = ''; }
  document.getElementById('bkauto').addEventListener('click', function () { if (!window.DLBackup) return; document.getElementById('setbox').hidden = true; document.getElementById('setb').setAttribute('aria-expanded', 'false'); ask = ''; bkm.hidden = false; paint(); });
  document.getElementById('setb').addEventListener('click', info); setTimeout(info, 1200);
  bkm.addEventListener('click', function (e) {
    if (e.target === bkm || e.target.id === 'bkclose') { close(); return; }
    var b = e.target.closest('[data-bkr]'); if (!b || busy) return;
    if (ask !== b.dataset.bkr) { ask = b.dataset.bkr; paint(); return; }
    busy = true; bksh.insertAdjacentHTML('afterbegin', '<p class="bkinfo" style="margin:0">A restaurar…</p>');
    window.DLBackup.restore(ask, function (ok) { busy = false; if (ok) location.reload(); else { ask = ''; paint(); } });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !bkm.hidden) close(); });
})();
</script>
