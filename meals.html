<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();});});document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});</script>
<meta name="theme-color" content="#F6EEE6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #F6EEE6; --paper: #FFFCF8; --ink: #3A322D; --mute: #7A6E65; --line: #E7DDD1; --accent: #A9703F; --accent-ink: #FFFFFF; --orchid: color-mix(in srgb, var(--accent) 26%, #fff);
  --shadow: rgba(90, 70, 50, .14); --bad: #C0392B; --ok: #3E9D6A; --font: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; overscroll-behavior-y: none; }
html, body, button, a, input, select, label, textarea { touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; transition: transform 140ms var(--ease-out), background-color 150ms ease, color 150ms ease; }
button:active { transform: scale(.97); }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 15; background: var(--bg); margin: 0 -16px; display: flex; align-items: center; gap: 12px; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 10px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; flex: 1; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; font-size: 22px; color: var(--ink); text-decoration: none; line-height: 1; }
input[type="text"], input[type="search"], input[type="number"], textarea { width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 400 16px var(--font); }
textarea { resize: vertical; min-height: 110px; }
input::placeholder, textarea::placeholder { color: var(--mute); }
input[type="search"] { border-radius: 999px; padding: 14px 18px; -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { padding: 12px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 14px; }
.btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.btn.full { width: 100%; padding: 14px; font-size: 15px; }
.btn.bad { background: var(--bad); }
.wk { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.wk .lab { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
.wk .lab small { display: block; font-weight: 400; font-size: 12px; color: var(--mute); }
.wk button.r { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); font-size: 20px; }
.pill { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; color: var(--mute); }
.day { background: var(--paper); border-radius: 20px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 10px 26px -18px var(--shadow); }
.day.today { outline: 2px solid var(--orchid); }
.day h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
.day h3 span { color: var(--mute); font-weight: 400; font-size: 13px; }
.slot { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 4px; border-top: 1px solid var(--line); min-height: 44px; }
.slot .sl { flex: none; width: 58px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
.slot .st { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.slot .st.empty { color: var(--mute); }
.slot .st small { display: block; color: var(--mute); font-size: 12px; }
.card { display: block; width: 100%; text-align: left; background: var(--paper); border-radius: 18px; padding: 13px 16px; margin-bottom: 8px; box-shadow: 0 10px 26px -18px var(--shadow); }
.card b { font-weight: 600; display: block; }
.card small { color: var(--mute); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { padding: 3px 10px; border-radius: 999px; background: var(--bg); font-size: 12px; color: var(--ink); }
.chipsrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chipsrow button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; color: var(--mute); }
.chipsrow button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--mute); padding: 30px 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border-radius: 16px; padding: 11px 14px; margin-bottom: 6px; }
.item .box { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.item[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item[aria-pressed="true"] .tx { text-decoration: line-through; color: var(--mute); }
.item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .tx small { display: block; color: var(--mute); font-size: 12px; }
.item .x { flex: none; width: 30px; height: 30px; border-radius: 50%; color: var(--mute); }
.h { margin: 18px 4px 8px; font-size: 14px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; }
.addrow { display: flex; gap: 8px; margin-bottom: 12px; }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 640px; margin: 0 auto; }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 9px; font-size: 12px; font-weight: 500; color: var(--mute); }
.tabbar button[aria-pressed="true"] { color: var(--accent); }
.tabbar button[aria-pressed="true"]::before { content: ""; position: absolute; top: -1px; left: 50%; width: 36px; height: 3px; margin-left: -18px; border-radius: 0 0 3px 3px; background: var(--accent); }
.modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-start; justify-content: center; background: color-mix(in srgb, var(--ink) 45%, transparent); padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px; }
.modal:not([hidden]) { animation: fadein 160ms var(--ease-out); }
.modal:not([hidden]) .sheet { animation: sheetin 220ms var(--ease-out); }
.sheet { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--bg); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 20px; }
.sheet label { font-size: 13px; color: var(--mute); display: block; margin: 0 0 4px 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { max-height: 34vh; overflow-y: auto; }
.dm { margin: -2px 0 6px; font-size: 12px; color: var(--mute); }
.mac { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mac label { margin: 0 0 3px 2px; font-size: 11px; }
.mac input { padding: 10px 8px; text-align: center; }
.mrow { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; }
.mrow .mn { flex: 1; min-width: 0; }
.mrow .mn b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow small { display: block; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow input { width: 86px; padding: 8px 10px; border-radius: 12px; }
.mrow .flagb { flex: none; padding: 6px 12px; border-radius: 999px; background: #FCEBD6; color: #A5560E; font-size: 12px; font-weight: 600; }
.mrow .chg { flex: none; color: var(--mute); font-size: 12px; padding: 6px 4px; }
.mtot { background: var(--paper); border-radius: 18px; padding: 12px 14px; font-size: 15px; }
.mtot b { font-weight: 600; }
.mtot small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px; }
.mres button { display: block; width: 100%; text-align: left; background: var(--paper); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; }
.mres small { display: block; color: var(--mute); font-size: 12px; }
.irows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.irow { display: grid; grid-template-columns: 1fr 1.3fr 36px; gap: 6px; background: var(--paper); border-radius: 16px; padding: 8px; }
.irow .in-n { grid-column: 1 / -1; }
.irow input, .irow select { padding: 10px 12px; border-radius: 12px; }
.irow select { width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 400 16px var(--font); }
.irow input:disabled { opacity: .45; }
.irow .rm { width: 36px; height: 36px; border-radius: 50%; color: var(--mute); align-self: center; }
.mchip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 14px; color: var(--ink); margin: 0 6px 6px 0; }
.chipsrow .mchip button { border: 0; background: none; padding: 8px 4px 8px 14px; color: inherit; border-radius: 999px; font-size: 14px; }
.chipsrow .mchip button + button { padding: 8px 12px 8px 4px; color: var(--mute); }
.itemw { display: flex; align-items: center; background: var(--paper); border-radius: 16px; margin-bottom: 6px; }
.itemw .item { margin: 0; background: none; flex: 1; min-width: 0; }
.flag { flex: none; margin-right: 10px; padding: 5px 11px; border-radius: 999px; background: #FCEBD6; color: #A5560E; font-size: 12px; font-weight: 600; }
.view h3 { margin: 6px 0 4px; font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; }
.view ul { margin: 0; padding-left: 20px; }
.view .st { white-space: pre-wrap; margin: 0; }
.view .fl { color: #A5560E; font-size: 12px; font-weight: 600; margin-left: 6px; }
@keyframes fadein { from { opacity: 0; } }
@keyframes sheetin { from { opacity: 0; transform: translateY(12px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="ibtn" href="index.html" aria-label="Back to Daily Life">‹</a>
    <h1>Meals</h1>
    <!-- INFO-ICON --><button class="ibtn" data-info="1" aria-label="How to share a link here" style="font: 600 18px/1 var(--font)">i</button><!-- /INFO-ICON -->
  </header>
  <section id="v-plan"></section>
  <section id="v-rec" hidden></section>
  <section id="v-shop" hidden></section>
</div>

<div class="modal" id="m" hidden><div class="sheet" id="sh"></div></div>

<nav class="navbar" aria-label="Sections"><div class="tabbar">
  <button data-v="plan" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-v="rec" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14a0 0 0 0 1 0 0v1a7 7 0 0 1-7 7 7 7 0 0 1-7-7v-1z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>Recipes</button>
  <button data-v="shop" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h2.5l2 10h9.5l2-7.5H7"/><circle cx="9.5" cy="19" r="1.2"/><circle cx="16.5" cy="19" r="1.2"/></svg>Shopping</button>
</div></nav>

<script type="module" src="sync.js?v=10"></script>
<script>
(function () {
  'use strict';
  var LS = 'meals-v1';
  var SL = [['l', 'Lunch'], ['s', 'Snack']];   // Dinner is hidden for now (anything already planned for dinner stays saved): to bring it back, put ['d', 'Dinner'] between the two

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var BASE_TAGS = ['quick', 'vegetarian', 'freezes well'];
  /* data: recipes [{id,n,min,tags[],ing[],steps,u}], plan {'YYYY-MM-DD': {l|d|s: {r: recipe id} or {t: free text}}},
     chk {'weekMonday': {normalised ingredient: 1}} (ticked on the shopping list), extra [{id,t,done}] (things typed by hand) */
  var data = load(), view = 'plan', wk = monday(new Date()), rq = '', rtag = '', slotCtx = null, edId = null, edTags = [], sure = false;

  function load() {
    var d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
    if (!d || typeof d !== 'object') d = {};
    return { recipes: Array.isArray(d.recipes) ? d.recipes : [], plan: d.plan && typeof d.plan === 'object' ? d.plan : {}, chk: d.chk && typeof d.chk === 'object' ? d.chk : {}, extra: Array.isArray(d.extra) ? d.extra : [] };
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} markDirty(); }
  /* tells the cloud sync that this device has changes to send. Needed because a link shared into the page is saved while the page loads,
     before sync.js is ready to notice it; without this the sync would take the cloud copy and drop the new link. */
  function markDirty() { try { var mt = JSON.parse(localStorage.getItem('daily-life-sync-meta') || '{}') || {}; mt.dirty = true; localStorage.setItem('daily-life-sync-meta', JSON.stringify(mt)); } catch (e) {} }
  function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function ds(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function monday(d) { var x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function nrm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  function recById(id) { return data.recipes.filter(function (r) { return r.id === id; })[0]; }
  function recs() { return data.recipes.filter(function (r) { return !r.del; }); }   // a deleted recipe stays in the data (so the other devices learn about it) but is hidden
  function cleanLines(t) { return String(t || '').split('\n').map(function (l) { return l.replace(/^\s*[-•*]\s*/, '').trim(); }).filter(Boolean); }
  function slotOf(k, s) { var d = data.plan[k]; return d && d[s] && !d[s].x ? d[s] : null; }   // {x:1} = cleared
  function slotText(m) {   // [title, subtitle] for a planned meal
    if (!m) return null;
    if (m.r) { var r = recById(m.r); return r ? [r.n, r.min ? r.min + ' min' : ''] : [m.t || 'Deleted recipe', '']; }
    return m.t ? [m.t, ''] : null;
  }
  function setSlot(k, s, v) {
    var d = data.plan[k] || (data.plan[k] = {});
    d[s] = v ? Object.assign({}, v, { u: Date.now() }) : { x: 1, u: Date.now() };   // a cleared meal is kept as a marker so the clearing syncs
    save();
  }

  /* plan */
  function renderPlan() {
    var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(wk, i); }), end = days[6], now = ds(new Date());
    var sameMonth = wk.getMonth() === end.getMonth();
    var cur = ds(monday(new Date())) === ds(wk);
    var h = '<div class="wk"><button class="r" data-wk="-1" aria-label="Previous week">‹</button><div class="lab">' + wk.getDate() + (sameMonth ? '' : ' ' + MON[wk.getMonth()]) + ' – ' + end.getDate() + ' ' + MON[end.getMonth()] + '<small>' + (cur ? 'This week' : '<button data-wk="0" class="pill">Back to this week</button>') + '</small></div><button class="r" data-wk="1" aria-label="Next week">›</button></div>';
    h += days.map(function (d) {
      var k = ds(d);
      return '<div class="day' + (k === now ? ' today' : '') + '"><h3>' + DAYS[d.getDay()] + '<span>' + d.getDate() + ' ' + MON[d.getMonth()] + '</span></h3>' + dayMacros(k) + SL.map(function (s) {
        var t = slotText(slotOf(k, s[0]));
        return '<button class="slot" data-k="' + k + '" data-s="' + s[0] + '"><span class="sl">' + s[1] + '</span><span class="st' + (t ? '' : ' empty') + '">' + (t ? esc(t[0]) + (t[1] ? '<small>' + esc(t[1]) + '</small>' : '') : '+ add') + '</span></button>';
      }).join('') + '</div>';
    }).join('');
    h += '<button class="btn ghost full" data-copy="1">Copy last week into the empty slots</button>';
    $('v-plan').innerHTML = h;
  }
  function openSlot(k, s) {
    slotCtx = { k: k, s: s, q: '' };
    var d = new Date(k + 'T12:00:00'), lab = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' · ' + SL.filter(function (x) { return x[0] === s; })[0][1];
    var cur = slotOf(k, s);
    $('sh').innerHTML = '<h2>' + esc(lab) + '</h2><input type="search" id="sq" placeholder="Search your recipes" autocomplete="off" aria-label="Search recipes"><div class="pick" id="spick"></div>' +
      '<div><label for="sfree">Or type what you are eating</label><div class="addrow" style="margin:0"><input type="text" id="sfree" placeholder="e.g. Lunch out" value="' + (cur && !cur.r ? esc(cur.t) : '') + '"><button class="btn" data-sfree="1">Use</button></div></div>' +
      (cur ? '<button class="btn ghost full" data-sclear="1">Clear this meal</button>' : '') + '<button class="btn ghost full" data-close="1">Close</button>';
    fillPick(); $('m').hidden = false;
  }
  function fillPick() {
    var q = nrm(slotCtx.q), l = recs().filter(function (r) { return !q || nrm(r.n + ' ' + (r.tags || []).join(' ')).indexOf(q) !== -1; }).sort(function (a, b) { return a.n.localeCompare(b.n); });
    $('spick').innerHTML = l.length ? l.map(function (r) { return '<button class="card" data-rpick="' + r.id + '"><b>' + esc(r.n) + '</b><small>' + (r.min ? r.min + ' min' : '') + ((r.tags || []).length ? (r.min ? ' · ' : '') + esc(r.tags.join(', ')) : '') + '</small></button>'; }).join('') : '<div class="empty">' + (recs().length ? 'No recipe matches.' : 'No recipes yet. Add some in the Recipes tab, or type the meal below.') + '</div>';
    $('spick').innerHTML = $('spick').innerHTML + savedHTML(q);
  }
  function copyWeek() {
    var prev = addDays(wk, -7), n = 0;
    for (var i = 0; i < 7; i++) SL.forEach(function (s) {
      var a = ds(addDays(prev, i)), b = ds(addDays(wk, i)), m = slotOf(a, s[0]);
      if (m && !slotOf(b, s[0])) { var d = data.plan[b] || (data.plan[b] = {}); d[s[0]] = Object.assign(JSON.parse(JSON.stringify(m)), { u: Date.now() }); n++; }
    });
    save(); renderPlan();
  }

  /* recipes */
  function allTags() { var o = BASE_TAGS.slice(); recs().forEach(function (r) { (r.tags || []).forEach(function (t) { if (o.indexOf(t) === -1) o.push(t); }); }); return o; }
  function renderRec() {
    var q = nrm(rq), l = recs().filter(function (r) { return (!rtag || (r.tags || []).indexOf(rtag) !== -1) && (!q || nrm(r.n + ' ' + (r.ing || []).join(' ')).indexOf(q) !== -1); }).sort(function (a, b) { return a.n.localeCompare(b.n); });
    var keepL = $('lin') ? $('lin').value : '';
    var h = linksHTML() + '<div class="stack"><input type="search" id="rq" placeholder="Search recipes or ingredients" value="' + esc(rq) + '" autocomplete="off" aria-label="Search recipes">' +

  function hasQty(line) { return /\d|[½¼¾]|\b(um|uma|dois|duas|meia|meio|pitada|punhado|fio|q\.?b\.?|a gosto|dentes?|ramo|molho)\b/i.test(line); }   // does the ingredient line say how much?
  function qtyMap(wkey) { var m = {}; data.extra.forEach(function (x) { if (x.k === 'qty' && !x.del && x.wk === wkey) m[x.key] = x.t; }); return m; }
  var qCtx = null;
  function openQty(key) {
    var w = ds(wk), cur = qtyMap(w)[key] || '', it = weekItems().filter(function (i) { return i.key === key; })[0]; if (!it) return;
    qCtx = { key: key, wkey: w };
    $('sh').innerHTML = '<h2>' + esc(it.t) + '</h2><p style="margin:0;color:var(--mute);font-size:14px">The recipe does not say how much. Type the amount for this week (e.g. 500 g, 2 units, a pinch).</p>' +
      '<div><label for="qin2">Amount</label><input type="text" id="qin2" value="' + esc(cur) + '" placeholder="e.g. 500 g"></div>' +
      '<button class="btn full" data-qsave="1">Save</button>' + (cur ? '<button class="btn ghost full" data-qclear="1">Remove the amount</button>' : '') + '<button class="btn ghost full" data-close="1">Cancel</button>';
    $('m').hidden = false; setTimeout(function () { var i = $('qin2'); if (i) i.focus(); }, 60);
  }
  function setQty(text) {
    var id = 'q|' + qCtx.wkey + '|' + qCtx.key, x = data.extra.filter(function (y) { return y.id === id; })[0], now = Date.now();
    if (!x) { x = { id: id, k: 'qty', wk: qCtx.wkey, key: qCtx.key }; data.extra.push(x); }
    x.t = text; x.del = !text; x.u = now; save(); closeM(); renderShop();
  }
  function links() { return data.extra.filter(function (x) { return x.k === 'link' && !x.del; }); }   // recipe links waiting to be turned into recipes
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }
  function linksHTML() {
    var L = links();
    return '<form class="addrow" id="lf" autocomplete="off"><input type="text" id="lin" inputmode="url" placeholder="Paste a recipe link" aria-label="Recipe link"><button class="btn" type="submit">+</button></form>' + (lmsg ? '<p style="margin:-4px 4px 10px;font-size:13px;color:var(--mute)">' + esc(lmsg) + '</p>' : '') +
      (L.length ? '<div class="h" style="margin-top:0">Waiting to become recipes (' + L.length + ')</div>' + L.map(function (x) { return '<div class="item"><span class="tx">' + esc(hostOf(x.url)) + '<small>' + esc(x.url) + '</small></span><button class="x" data-ld="' + x.id + '" aria-label="Remove link">✕</button></div>'; }).join('') + '<div style="height:10px"></div>' : '');
  }
  var lmsg = '';
  function saveLink(v) {   // 'ok' | 'dup' | 'bad'
    v = String(v || '').trim(); if (!v) return 'bad';
    var found = v.match(/https?:\/\/\S+/); if (found) v = found[0];   // a shared text like "Look at this https://…" keeps only the link
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { new URL(v); } catch (e) { return 'bad'; }
    if (links().some(function (x) { return x.url === v; })) return 'dup';
    data.extra.push({ id: uid(), k: 'link', url: v, u: Date.now() }); save(); return 'ok';
  }
  function addLink() {
    var i = $('lin'), r = saveLink(i.value); if (!i.value.trim()) return;
    if (r === 'bad') { i.focus(); return; }
    lmsg = r === 'ok' ? 'Link saved ✓' : 'That link is already waiting'; i.value = ''; renderRec();
  }
  function renderShop() {
    var wkey = ds(wk), chk = data.chk[wkey] || {}, items = weekItems(), end = addDays(wk, 6);
    var h = '<div class="wk"><button class="r" data-wk="-1" aria-label="Previous week">‹</button><div class="lab">' + wk.getDate() + ' ' + MON[wk.getMonth()] + ' – ' + end.getDate() + ' ' + MON[end.getMonth()] + '<small>Built from the meals you planned</small></div><button class="r" data-wk="1" aria-label="Next week">›</button></div>';
    var qm = qtyMap(wkey);
    function row(it) {
      var noq = !hasQty(it.t), am = qm[it.key];
      var main = '<button class="item" data-ci="' + esc(it.key) + '" aria-pressed="' + (chk[it.key] > 0) + '"><span class="box"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx">' + (am ? '<b>' + esc(am) + '</b> · ' : '') + esc(it.t) + (it.n > 1 ? ' ×' + it.n : '') + '<small>' + esc(it.from.join(', ')) + '</small></span></button>';
      if (!noq) return main;
      return '<div class="itemw">' + main + '<button class="flag" data-qf="' + esc(it.key) + '" aria-label="Add the amount">' + (am ? 'edit' : '⚑ amount') + '</button></div>';
    }
    var todo = items.filter(function (i) { return !(chk[i.key] > 0); }), done = items.filter(function (i) { return chk[i.key] > 0; });
    h += items.length ? '<div class="h">To buy (' + todo.length + ')</div>' + (todo.concat(done).some(function (i) { return !hasQty(i.t) && !qm[i.key]; }) ? '<p style="margin:0 4px 8px;font-size:13px;color:var(--mute)">⚑ The recipe does not say how much. Tap it to add the amount.</p>' : '') + todo.map(row).join('') + (done.length ? '<div class="h">In the basket</div>' + done.map(row).join('') : '') : '<div class="empty">Nothing yet.<br>Plan some meals with recipes and their ingredients will show up here.</div>';
    h += '<div class="h">Extras</div><form class="addrow" id="xf" autocomplete="off"><input type="text" id="xin" placeholder="Add something (milk, coffee…)" aria-label="Add an extra item"><button class="btn" type="submit">Add</button></form>';
    h += extras().map(function (x) { return '<div class="item" style="padding:0"><button class="item" style="margin:0;flex:1" data-xd="' + x.id + '" aria-pressed="' + !!x.done + '"><span class="box"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx">' + esc(x.t) + '</span></button><button class="x" data-xx="' + x.id + '" aria-label="Remove">✕</button></div>'; }).join('');
    if (extras().some(function (x) { return x.done; }) || done.length) h += '<button class="btn ghost full" style="margin-top:12px" data-unt="1">Untick everything</button>';
    $('v-shop').innerHTML = h;
  }

  /* INFO-ICON: how to send a TikTok link straight into the app (iPhone Shortcut) */
  var SHARE_URL = 'https://danscraig.github.io/daily-life/meals.html#add=';
  function openInfo() {
    $('sh').innerHTML = '<h2>Share a recipe link into the app</h2>' +
      '<p style="margin:0;color:var(--mute);font-size:14px">On the iPhone, create a Shortcut once. After that, in TikTok tap Share and pick “Receita”: the link lands in the list “Waiting to become recipes”.</p>' +
      '<ol style="margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:6px">' +
      '<li>Open the <b>Shortcuts</b> app, tap <b>+</b> and name it <b>Receita</b>.</li>' +
      '<li>Tap <b>(i)</b> and turn on <b>Show in Share Sheet</b>. Keep only <b>URLs</b> and <b>Text</b> as accepted types.</li>' +
      '<li>Add the action <b>Text</b>. Paste the address below, then right after it insert the variable <b>Shortcut Input</b>.</li>' +
      '<li>Add the action <b>Open URLs</b> and give it that Text as input.</li>' +
      '<li>In TikTok: <b>Share</b>, then <b>Receita</b>.</li></ol>' +
      '<div><label>Address to paste in the Text action</label><input type="text" id="shareurl" readonly value="' + esc(SHARE_URL) + '"></div>' +
      '<button class="btn full" data-copyurl="1">Copy the address</button>' +
      '<p style="margin:0;color:var(--mute);font-size:13px">The link opens in Safari, so Safari must be signed in to the cloud account (Daily Life home, Cloud sync) for it to reach the other devices. Then ask Claude to turn the waiting links into recipes.</p>' +
      '<button class="btn ghost full" data-close="1">Close</button>';
    $('m').hidden = false;
  }
  function closeM() { $('m').hidden = true; slotCtx = null; edId = null; }
  function render() {
    $('v-plan').hidden = view !== 'plan'; $('v-rec').hidden = view !== 'rec'; $('v-shop').hidden = view !== 'shop';
    [].forEach.call(document.querySelectorAll('.tabbar button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
    if (view === 'plan') renderPlan(); else if (view === 'rec') renderRec(); else renderShop();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var D = b.dataset;
    if (D.v) { view = D.v; lmsg = ''; render(); window.scrollTo(0, 0); }
    else if (D.wk !== undefined) { wk = D.wk === '0' ? monday(new Date()) : addDays(wk, 7 * Number(D.wk)); render(); }
    else if (D.s && D.k) openSlot(D.k, D.s);
    else if (D.rpick && slotCtx) { setSlot(slotCtx.k, slotCtx.s, { r: D.rpick }); closeM(); render(); }
    else if (D.sfree && slotCtx) { var v = $('sfree').value.trim(); if (v) { saveMeal(v); setSlot(slotCtx.k, slotCtx.s, { t: v }); closeM(); render(); } else $('sfree').focus(); }
    else if (D.sclear && slotCtx) { setSlot(slotCtx.k, slotCtx.s, null); closeM(); render(); }
    else if (D.mpick && slotCtx) { var sm = data.extra.filter(function (y) { return y.id === D.mpick; })[0]; if (sm) { sm.u = Date.now(); setSlot(slotCtx.k, slotCtx.s, { t: sm.t }); closeM(); render(); } }
    else if (D.mdel && slotCtx) { var dm = data.extra.filter(function (y) { return y.id === D.mdel; })[0]; if (dm) { dm.del = true; dm.u = Date.now(); save(); fillPick(); } }
    else if (D.copy) copyWeek();
    else if (D.info) openInfo();
    else if (D.copyurl) { var cu = $('shareurl'); cu.focus(); cu.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {} if (!ok && navigator.clipboard) { navigator.clipboard.writeText(SHARE_URL).catch(function () {}); ok = true; } b.textContent = ok ? 'Copied ✓' : 'Select the address and copy it'; }
    else if (D.close) closeM();
    else if (D.rt !== undefined) { rtag = rtag === D.rt ? '' : D.rt; renderRec(); }
    else if (D.newr) openRec('');
    else if (D.ld) { var lk = data.extra.filter(function (y) { return y.id === D.ld; })[0]; if (lk) { lk.del = true; lk.u = Date.now(); save(); renderRec(); } }
    else if (D.er) openView(D.er);
    else if (D.edit) openRec(D.edit);
    else if (D.macros) openMacros(D.macros);
    else if (D.mclose) { if (mx) openView(mx.id); }
    else if (D.mfind) openMatch(D.mfind, D.mn);
    else if (D.msearch) mSearch();
    else if (D.mbackm) renderMacros();
    else if (D.mxpick !== undefined && mctx) { var pk = mctx.res[Number(D.mxpick)]; if (pk) { saveNut(mctx.key, mctx.name, pk); renderMacros(); } }
    else if (D.mman && mctx) { var mk1 = num($('mmk').value), mp1 = num($('mmp').value), mc1 = num($('mmc').value), mf1 = num($('mmf').value); if (mk1 != null) { saveNut(mctx.key, mctx.name, { d: 'typed by you', kcal: Math.round(mk1), p: mp1 || 0, c: mc1 || 0, f: mf1 || 0 }); renderMacros(); } else $('mmk').focus(); }
    else if (D.msave && mx) { var t = mxTotals(), rr = recById(mx.id); if (rr) { rr.serv = t.s; rr.mac = { k: t.k, p: t.p, c: t.c, f: t.f, cov: t.ok + '/' + t.tot }; rr.u = Date.now(); save(); } openView(mx.id); render(); }
    else if (D.iadd) { readRows(); edItems.push({ n: '', q: '', u: '' }); paintRows(); var ns = document.querySelectorAll('#irows .in-n'); if (ns.length) ns[ns.length - 1].focus(); }
    else if (D.irm !== undefined) { readRows(); edItems.splice(Number(D.irm), 1); paintRows(); }
    else if (D.qf) openQty(D.qf);
    else if (D.qsave && qCtx) setQty($('qin2').value.trim());
    else if (D.qclear && qCtx) setQty('');
    else if (D.et) { var i = edTags.indexOf(D.et); if (i === -1) edTags.push(D.et); else edTags.splice(i, 1); paintTags(); }
    else if (D.rsave) saveRec();
    else if (D.rdel) delRec();
    else if (D.ci) { var w = ds(wk), c = data.chk[w] || (data.chk[w] = {}); c[D.ci] = c[D.ci] > 0 ? -Date.now() : Date.now(); save(); renderShop(); }
    else if (D.xd) { var x = data.extra.filter(function (y) { return y.id === D.xd; })[0]; if (x) { x.done = !x.done; x.u = Date.now(); save(); renderShop(); } }
    else if (D.xx) { var xr = data.extra.filter(function (y) { return y.id === D.xx; })[0]; if (xr) { xr.del = true; xr.u = Date.now(); save(); renderShop(); } }
    else if (D.unt) { var uc = data.chk[ds(wk)] || {}, un = Date.now(); Object.keys(uc).forEach(function (i) { uc[i] = -un; }); data.extra.forEach(function (y) { if (y.done) { y.done = false; y.u = un; } }); save(); renderShop(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'mserv' && mx) { mx.serv = t.value; paintTot(); return; }
    if (t.dataset && t.dataset.mg && mx) { var rc = nutRec(t.dataset.mg), gv = num(t.value); if (rc && gv > 0) { rc.g = gv; rc.u = Date.now(); save(); paintTot(); } return; }
    if (t.id === 'rq') { rq = t.value; var pos = t.selectionStart; renderRec(); var n = $('rq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
    else if (t.id === 'sq' && slotCtx) { slotCtx.q = t.value; fillPick(); }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'lf') { e.preventDefault(); addLink(); return; }
    if (e.target.id === 'xf') { e.preventDefault(); var v = $('xin').value.trim(); if (v) { data.extra.push({ id: uid(), t: v, done: false, u: Date.now() }); save(); renderShop(); $('xin').focus(); } }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('m').hidden) closeM();
    if (e.key === 'Enter' && e.target.id === 'rt') { e.preventDefault(); addTag(); }
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('in-n')) { e.preventDefault(); var ab = document.querySelector('[data-iadd]'); if (ab) ab.click(); }
    if (e.key === 'Enter' && e.target.id === 'sfree') { e.preventDefault(); var b = document.querySelector('[data-sfree]'); if (b) b.click(); }
  });
  $('m').addEventListener('click', function (e) { if (e.target === $('m')) closeM(); });
  document.addEventListener('change', function (e) { var t = e.target; if (t.classList && t.classList.contains('in-u')) { var q = t.closest('.irow').querySelector('.in-q'); q.disabled = t.value === 'a gosto'; } });
  window.addEventListener('storage', function (e) { if (e.key === LS) { data = load(); if ($('m').hidden) render(); } });
  var sh = (location.hash || '').match(/^#add=([\s\S]+)$/);
  if (sh) {
    var shared = sh[1]; try { shared = decodeURIComponent(shared); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    var sr = saveLink(shared); view = 'rec';
    lmsg = sr === 'ok' ? 'Link saved ✓' : sr === 'dup' ? 'That link is already waiting' : 'That did not look like a link';
  }
  render();
})();
</script>
</body>
</html>
