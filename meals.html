<style>
:root {
  --bg: #F6EEE6; --paper: #FFFCF8; --ink: #3A322D; --mute: #7A6E65; --line: #E7DDD1; --accent: #A9703F; --accent-ink: #FFFFFF; --orchid: color-mix(in srgb, var(--accent) 26%, #fff);

.navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

.mrow .chg { flex: none; color: var(--mute); font-size: 12px; padding: 6px 4px; }

.irows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

.irow .in-n { grid-column: 1 / -1; }

.irow select { width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 400 16px var(--font); }
.irow input:disabled { opacity: .45; }
.irow .rm { width: 36px; height: 36px; border-radius: 50%; color: var(--mute); align-self: center; }
.mchip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 14px; color: var(--ink); margin: 0 6px 6px 0; }

.chipsrow .mchip button + button { padding: 8px 12px 8px 4px; color: var(--mute); }

.itemw .item { margin: 0; background: none; flex: 1; min-width: 0; }

.shr .hv button[data-hs="y"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.shr .hv button[data-hs="n"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.pmseg { margin: 0 0 12px; }
.view h3 { margin: 6px 0 4px; font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; }
.view ul { margin: 0; padding-left: 20px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
/* text boxes grow with what is typed. The page position is kept while the box is measured, so nothing jumps up and down. */
function fitBox(t) {
  if (!t || t.tagName !== 'TEXTAREA' || !t.getClientRects().length) return;
  var keep = [], n = t.parentNode, se = document.scrollingElement || document.documentElement;
  for (; n && n.nodeType === 1; n = n.parentNode) if (n.scrollTop) keep.push([n, n.scrollTop]);
  keep.push([se, se.scrollTop]);
  var cs = getComputedStyle(t), bd = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0), pd = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  t.style.height = 'auto';
  var h = t.scrollHeight + (cs.boxSizing === 'border-box' ? bd : -pd);
  t.style.height = h + 'px';
  keep.forEach(function (k) { if (k[0].scrollTop !== k[1]) k[0].scrollTop = k[1]; });
}
(function () {
  function go() {
    document.addEventListener('input', function (e) { if (e.target.tagName === 'TEXTAREA') fitBox(e.target); });
    document.addEventListener('focusin', function (e) { if (e.target.tagName === 'TEXTAREA') fitBox(e.target); });
    new MutationObserver(function (ms) { ms.forEach(function (m) { [].forEach.call(m.addedNodes, function (nd) { if (nd.nodeType === 1) (nd.tagName === 'TEXTAREA' ? [nd] : [].slice.call(nd.querySelectorAll('textarea'))).forEach(fitBox); }); }); }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
})();
</script>

<script>
(function () {
  'use strict';
  var LS = 'meals-v1';
  var SL = [['l', 'Almoço'], ['s', 'Lanche']];   // o jantar está escondido por agora (o que já estava planeado fica guardado): para o voltar a ter, pôr ['d', 'Jantar'] entre os dois

  var DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var MON = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var BASE_TAGS = ['rápido', 'vegetariano', 'congela bem'];
  /* data: recipes [{id,n,min,tags[],ing[],steps,u}], plan {'YYYY-MM-DD': {l|d|s: {r: recipe id} or {t: free text}}},
     chk {'weekMonday': {normalised ingredient: 1}} (ticked on the shopping list), extra [{id,t,done}] (things typed by hand) */
  var data = load(), view = 'plan', pmode = 'week', ask = '', swk = addDays(monday(new Date()), 7), wk = monday(new Date()), rq = '', rtag = '', slotCtx = null, edId = null, edTags = [], sure = false;

  function load() {
    var d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
    if (!d || typeof d !== 'object') d = {};
    return { recipes: Array.isArray(d.recipes) ? d.recipes : [], plan: d.plan && typeof d.plan === 'object' ? d.plan : {}, chk: d.chk && typeof d.chk === 'object' ? d.chk : {}, extra: Array.isArray(d.extra) ? d.extra : [] };
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} markDirty(); }
  /* tells the cloud sync that this device has changes to send. Needed because a link shared into the page is saved while the page loads,
     before sync.js is ready to notice it; without this the sync would take the cloud copy and drop the new link. */
  function markDirty() { try { var mt = JSON.parse(localStorage.getItem('daily-life-sync-meta') || '{}') || {}; mt.dirty = true; localStorage.setItem('daily-life-sync-meta', JSON.stringify(mt)); } catch (e) {} }
  function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function ds(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function monday(d) { var x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function nrm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  function recById(id) { return data.recipes.filter(function (r) { return r.id === id; })[0]; }
  function recs() { return data.recipes.filter(function (r) { return !r.del; }); }   // a deleted recipe stays in the data (so the other devices learn about it) but is hidden
  function cleanLines(t) { return String(t || '').split('\n').map(function (l) { return l.replace(/^\s*[-•*]\s*/, '').trim(); }).filter(Boolean); }
  function slotOf(k, s) { var d = data.plan[k]; return d && d[s] && !d[s].x ? d[s] : null; }   // {x:1} = cleared
  function slotText(m) {   // [title, subtitle] for a planned meal
    if (!m) return null;
    if (m.r) { var r = recById(m.r); return r ? [r.n, r.min ? r.min + ' min' : ''] : [m.t || 'Receita apagada', '']; }
    return m.t ? [m.t, ''] : null;
  }
  function setSlot(k, s, v) {
    var d = data.plan[k] || (data.plan[k] = {}), old = d[s], now = Date.now();
    d[s] = v ? Object.assign({}, v, { u: now }) : { x: 1, u: now };   // a cleared meal is kept as a marker so the clearing syncs
    if (k.charAt(0) === 'T') followTpl(+k.slice(1), s, old, v, now);
    save();
  }
  /* the usual week ("semana-tipo"): stored as plan['T0'..'T6'] (Monday = T0), so it syncs like any other day.
     Every week from this one on starts as a copy of it; the empty slots are filled in when the week is shown. */
  var TK = ['T0', 'T1', 'T2', 'T3', 'T4', 'T5', 'T6'], TD = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
  function tplHas() { return TK.some(function (k) { return SL.some(function (s) { return !!slotOf(k, s[0]); }); }); }
  function mealSig(m) { return m && !m.x ? (m.r || '') + '|' + (m.t || '') : ''; }
  function fillFromTpl(mon) {   // slots with nothing in them get the usual meal; a slot you cleared by hand stays empty
    if (ds(mon) < ds(monday(new Date())) || !tplHas()) return;
    var n = 0, now = Date.now();
    for (var i = 0; i < 7; i++) SL.forEach(function (s) {
      var k = ds(addDays(mon, i)), t = slotOf(TK[i], s[0]), cur = data.plan[k] && data.plan[k][s[0]];
      if (t && !cur) { var d = data.plan[k] || (data.plan[k] = {}); d[s[0]] = Object.assign(JSON.parse(JSON.stringify(t)), { u: now }); n++; }
    });
    if (n) save();
  }
  function followTpl(i, s, old, v, now) {   // weeks that still hold the old usual meal take the new one
    var from = ds(monday(new Date()));
    Object.keys(data.plan).forEach(function (key) {
      if (!/^\d{4}-\d\d-\d\d$/.test(key) || key < from || (new Date(key + 'T12:00:00').getDay() + 6) % 7 !== i) return;
      var cur = data.plan[key][s]; if (!cur || mealSig(cur) !== mealSig(old)) return;
      data.plan[key][s] = v ? Object.assign({}, v, { u: now }) : { x: 1, u: now };
    });
  }
  function strip(m) { var o = JSON.parse(JSON.stringify(m)); delete o.u; return o; }
  function swapDays(a, b) {
    if (a === b) return;
