<style>
:root {

* { box-sizing: border-box; }

.tile b { font-weight: 500; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

@keyframes pop { 0% { transform: scale(.85); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }

@keyframes fall { to { transform: translateY(105vh) rotate(var(--r)); } }
.step { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px 14px 10px 10px; background: var(--paper); border-radius: 20px; box-shadow: 0 10px 26px -18px var(--shadow); }
